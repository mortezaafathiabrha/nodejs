apiVersion: apps/v1
kind: Deployment
metadata:
  name: unhappy-db
  labels:
    app: unhappy-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unhappy-db
  template:
    metadata:
      labels:
        app: unhappy-db
    spec:
      containers:
        - name: app
          image: unhappy-db:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_URL
              value: postgres://app:app@unknown-db-source.invalid:5432/app
            - name: DB_CONNECT_TIMEOUT_MS
              value: "5000"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
